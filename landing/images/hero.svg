<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#5849c4;stop-opacity:0.95" />
    </linearGradient>
    <radialGradient id="circle1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="circle2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="300" fill="url(#circle1)"/>
  <circle cx="1400" cy="750" r="350" fill="url(#circle2)"/>
